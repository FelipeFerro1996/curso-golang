services:
  mysql:
    image: mysql:8.4
    container_name: curso_devbook_go
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: curso_go
      MYSQL_USER: go
      MYSQL_PASSWORD: go

    ports:
      - "3306:3306"

    volumes:
      - ./data:/var/lib/mysql